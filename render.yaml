# Render Blueprint — 대시보드에서 New > Blueprint 로 이 저장소를 고르면 아래대로 만든다.
# 비밀값(sync: false)은 Render 화면에서 직접 입력 (저장소·채팅에 적지 않는다).
# 공개 주소(QR/NFC)는 Render 가 주는 RENDER_EXTERNAL_URL 을 자동으로 쓴다 (config.py).
services:
  - type: web
    name: safebridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 항상 켜짐 (free 는 15분 쉬면 잠들고 디스크를 못 붙인다)
    region: singapore
    healthCheckPath: /api/health
    # DB·사진은 디스크에 둔다 → 재배포·재시작해도 남는다
    disk:
      name: safebridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SAFEBRIDGE_DATABASE_URL
        value: sqlite:////var/data/safebridge.db
      # 디스크에 DB 가 아직 없을 때(첫 기동) 시연 상태 사본으로 시작
      - key: SAFEBRIDGE_SEED_DB_PATH
        value: /app/seed/safebridge.db
      - key: SAFEBRIDGE_PHOTO_DIR
        value: /var/data/photos
      - key: SAFEBRIDGE_LLM_PROVIDER
        value: claude
      - key: SAFEBRIDGE_CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: SAFEBRIDGE_DEMO_TODAY
        value: "2026-11-23"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SAFEBRIDGE_KMA_SERVICE_KEY
        sync: false
      - key: SAFEBRIDGE_KOSHA_SERVICE_KEY
        sync: false
      - key: SAFEBRIDGE_ADMIN_PASSWORD
        sync: false
      - key: SAFEBRIDGE_MANAGER_PASSWORD
        sync: false
      - key: SAFEBRIDGE_VIEWER_PASSWORD
        sync: false
